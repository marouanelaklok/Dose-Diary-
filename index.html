  let xp = (logs?.length || 0) * XP_VALUES.log_entry;
  xp += (cleanDays?.length || 0) * XP_VALUES.clean_day;
  if (streak >= 7)   xp += XP_VALUES.streak_7;
  if (streak >= 30)  xp += XP_VALUES.streak_30;
  if (streak >= 100) xp += XP_VALUES.streak_100;
  return xp;
};
const getLevel = (xp) => {
  let cur = XP_LEVELS[0];
  for (const l of XP_LEVELS) { if (xp >= l.min) cur = l; }
  return cur;
};
const getNextLevel = (xp) => XP_LEVELS.find(l => l.min > xp) || null;

function getInteractionKey(a, b) {
  const sorted = [a, b].sort();
  return `${sorted[0]}+${sorted[1]}`;
}

function findMixWarnings(currentSub, recentSubs) {
  const warnings = [];
  for (const recent of recentSubs) {
    if (recent === currentSub) continue;
    const key = getInteractionKey(currentSub, recent);
    if (INTERACTION_MATRIX[key]) {
      warnings.push({ sub: recent, ...INTERACTION_MATRIX[key] });
    }
  }
  // Sort by severity
  const order = { critical: 0, high: 1, medium: 2 };
  warnings.sort((a, b) => (order[a.level] ?? 3) - (order[b.level] ?? 3));
  return warnings;
}

const RISK_META = {
  critical : { icon:"⛔", shape:"▲", label:"Sehr hohes Risiko",  color:"var(--risk-critical)" },

};
const riskMeta = (riskStr) => {
  if (!riskStr) return RISK_META.unknown;
  const r = riskStr.toLowerCase();
  if (r.includes("sehr hoch") || r.includes("kritisch")) return RISK_META.critical;
  if (r.includes("hoch"))    return RISK_META.high;
  if (r.includes("mittel"))  return RISK_META.medium;
  if (r.includes("niedrig")) return RISK_META.low;
  return RISK_META.unknown;
};
const ago = d => { const m=Math.floor((Date.now()-new Date(d).getTime())/60000); if(m<60)return`vor ${m}m`; const h=Math.floor(m/60); if(h<24)return`vor ${h}h`; return`vor ${Math.floor(h/24)}d`; };
const weekLogs = logs => { const s=new Date(); s.setDate(s.getDate()-s.getDay()+1); s.setHours(0,0,0,0); return logs.filter(l=>new Date(l.date)>=s).length; };
const avgMood = ms => ms.length ? (ms.reduce((s,m)=>s+m.value,0)/ms.length).toFixed(1) : "–";
const byDay = logs => { const d={Mo:0,Di:0,Mi:0,Do:0,Fr:0,Sa:0,So:0}, m=["So","Mo","Di","Mi","Do","Fr","Sa"]; logs.forEach(l=>{d[m[new Date(l.date).getDay()]]++}); return d; };
const byTime = logs => { const t={"Morgen":0,"Nachmittag":0,"Abend":0,"Nacht":0}; logs.forEach(l=>{const h=new Date(l.date).getHours(); if(h>=6&&h<12)t.Morgen++;else if(h>=12&&h<18)t.Nachmittag++;else if(h>=18)t.Abend++;else t.Nacht++;}); return t; };
const bySub = logs => logs.reduce((a,l)=>{a[l.substance]=(a[l.substance]||0)+1;return a},{});
const mostCommon = arr => { const c=arr.reduce((a,v)=>{a[v]=(a[v]||0)+1;return a},{}); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"–"; };


// ─── Mood Trend (14 days) ───
const moodTrend = (moods, days=14) => {
  const result = [];
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const ds = d.toISOString().split("T")[0];
    const label = d.toLocaleDateString("de-DE",{weekday:"short"}).slice(0,2);
    const found = moods.find(m => m.date?.split("T")[0] === ds || new Date(m.date).toISOString().split("T")[0] === ds);
    result.push({ ds, label, value: found?.value||null, emoji: found?.emoji||null, isToday: i===0 });
  }
  return result;
};

// ─── Weekly Summary ───
const calcWeekSummary = (logs, moods, cleanDays) => {
  const ws = new Date(); ws.setDate(ws.getDate()-ws.getDay()+1); ws.setHours(0,0,0,0);
  const wLogs = logs.filter(l => new Date(l.date)>=ws);
  const wMoods = moods.filter(m => new Date(m.date)>=ws);
  const wClean = (cleanDays||[]).filter(d => new Date(d)>=ws).length;
  const avgC = wLogs.length ? +(wLogs.reduce((s,l)=>s+(l.craving||0),0)/wLogs.length).toFixed(1) : null;
  const avgM = wMoods.length ? +(wMoods.reduce((s,m)=>s+m.value,0)/wMoods.length).toFixed(1) : null;
  const topSub = wLogs.length ? mostCommon(wLogs.map(l=>l.substance)) : null;
  return { logCount:wLogs.length, cleanCount:wClean, avgCraving:avgC, avgMood:avgM, topSub };
};


// ─── Clean Day & Streak Helpers ───
const dateStr = d => new Date(d).toISOString().split("T")[0];
const todayStr = () => dateStr(new Date());
const calcStreak = (cleanDays, logs) => {
  if (!cleanDays?.length) return 0;
  const logDates = new Set(logs.map(l => dateStr(l.date)));
  const cleanSet = new Set(cleanDays);
  let streak = 0;
  const d = new Date(); d.setHours(0,0,0,0);
  // Check today: either marked clean or simply no log today
  const tStr = dateStr(d);
  if (!cleanSet.has(tStr) && logDates.has(tStr)) return 0; // consumed today
  if (cleanSet.has(tStr)) streak = 1;
  else if (!logDates.has(tStr)) { /* today ambiguous, don't count but don't break */ }
  // Walk backwards
  for (let i = 1; i < 1000; i++) {
    const prev = new Date(d); prev.setDate(prev.getDate() - i);
    const pStr = dateStr(prev);
    if (cleanSet.has(pStr)) { streak++; }
    else if (logDates.has(pStr)) { break; }
    else { break; } // no data = streak ends
  }
  return streak;
};
const calcLongestStreak = (cleanDays) => {
  if (!cleanDays?.length) return 0;
  const sorted = [...cleanDays].sort();
  let max = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i-1]); prev.setDate(prev.getDate() + 1);
    if (dateStr(prev) === sorted[i]) { cur++; max = Math.max(max, cur); }
    else { cur = 1; }
  }
  return max;
};

  const [prefs, setPrefs] = useState({ mySubs: [] }); // selected substances/behaviors
  const [kbProgress, setKbProgress] = useState({ read: {}, reflections: {} }); // read: {moduleId: timestamp}, reflections: {moduleId: text}
  const [skillbox, setSkillbox] = useState({ seenIntro: false, feedback: {}, emergencyContact: "" }); // feedback: {skillId: [{helped:bool, date:str}]}
  const [showMenu, setShowMenu] = useState(false);
  const [fade, setFade] = useState(true);
  const [onboarded, setOnboarded] = useState(null); // null = loading, false = show onboarding, true = done
  const [locked, setLocked] = useState(false);       // PIN-Sperre aktiv?
  const [onboardStep, setOnboardStep] = useState(0); // 0=age+disclaimer, 1=privacy, 2=substances, 3=features intro, 4=wissensdatenbank
  const [tourIdx, setTourIdx] = useState(0);
  const [milestonePopup, setMilestonePopup] = useState(null); // {id, title, icon, color, popup}
  const [seenMilestones, setSeenMilestones] = useState(new Set());
  const [jokerUsed, setJokerUsed] = useState(false); // Streak-Joker einmal pro Monat

  // Check onboarding status on mount
  useEffect(() => {
    (async () => {
      const ob = await S.get("dd_onboarded");
      if (ob === true) {
        setOnboarded(true);
        const [l, g, p] = await Promise.all([S.get("dd_logs"), S.get("dd_goals"), S.get("dd_prefs")]);
        if (l) setLogs(l);
        if (g) setGoals(g);
        if (p) {
          setPrefs(p);
          // Sperre beim Start aktivieren wenn PIN gesetzt
          if (p.pin) setLocked(true);
        }
        const kb = await S.get("dd_kb");
        if (kb) setKbProgress(kb);
        const sb = await S.get("dd_skillbox");
        if (sb) setSkillbox(sb);
        const jk = await S.get("dd_joker_used");
        if (jk) setJokerUsed(jk);
      } else {
        setOnboarded(false);
      }
    })();
  }, []);

  const save = useCallback(async (key, setter, data) => { setter(data); await S.set(key, data); }, []);
  // Sperre bei App-Hintergrund (visibilitychange)
  useEffect(() => {
    const handler = () => {
      if (document.visibilityState === "visible" && prefs?.pin) {
        setLocked(true);
      }
    };
    document.addEventListener("visibilitychange", handler);
    return () => document.removeEventListener("visibilitychange", handler);
  }, [prefs?.pin]);

  // Milestone-Check: bei jeder Änderung von logs/moods/goals/kbProgress/skillbox
  useEffect(() => {
    const newlyEarned = MILESTONES.filter(ms =>
      !seenMilestones.has(ms.id) && ms.check(logs, [], goals, kbProgress, skillbox)
    );
    if (newlyEarned.length > 0) {
      setSeenMilestones(prev => {
        const next = new Set(prev);
        newlyEarned.forEach(ms => next.add(ms.id));
        return next;
      });
      // Zeige das erste neue Popup (Queue: weitere erscheinen beim nächsten Render)
      setMilestonePopup(newlyEarned[0]);
    }
  }, [logs, goals, kbProgress, skillbox]);

  const nav = v => { setFade(false); setTimeout(() => { setView(v); setShowMenu(false); setFade(true); }, 120); };

  const saveKb = async (data) => { setKbProgress(data); await S.set("dd_kb", data); };
  const saveSkillbox = async (data) => { setSkillbox(data); await S.set("dd_skillbox", data); };
  const saveGoals = async (data) => { setGoals(data); await S.set("dd_goals", data); };
  const savePrefs = async (data) => { setPrefs(data); await S.set("dd_prefs", data); };

  const completeOnboarding = async () => {
    await S.set("dd_onboarded", true);
    setOnboarded(true);
  };

  const deleteAllData = async () => {
    await S.set("dd_logs", []);
    await S.set("dd_goals", { cleanDays:[], target:null, targetSubs:[], startDate:null, goalType:"clean", maxPerWeek:null });
    await S.set("dd_prefs", { mySubs: [] });
    await S.set("dd_kb", { read: {}, reflections: {} });
    await S.set("dd_skillbox", { seenIntro: false, feedback: {}, emergencyContact: "" });
    await S.set("dd_joker_used", false);
    setJokerUsed(false);
    await S.set("dd_meds", []);
    setLogs([]);
    setGoals({ cleanDays:[], target:null, targetSubs:[], startDate:null, goalType:"clean", maxPerWeek:null });
    setPrefs({ mySubs: [] });
    setKbProgress({ read: {}, reflections: {} });
    setSkillbox({ seenIntro: false, feedback: {}, emergencyContact: "" });
  };

  const resetOnboarding = async () => {
    await deleteAllData();
    await S.set("dd_onboarded", false);
    setOnboarded(false);
    setOnboardStep(0);
  };

  // ──── CSS Variables ────
  const theme = {
    "--bg":"#0E0B1A","--card":"#1A1529","--card2":"#221C34","--bdr":"#2F2845",
    // --tx2 angehoben von #9088A8 → #A89CC0 (WCAG AA: ~4.8:1 auf --bg)
    "--tx":"#E8E4F0","--tx2":"#A89CC0","--acc":"#9B7ECF","--accL":"#B89DE8",
    "--warn":"#E06B8A","--font":"'DM Sans',sans-serif","--fontD":"'Outfit',sans-serif",
    // Deuteranopie-sichere Risiko-Palette (Helligkeit statt Rot/Grün-Unterschied)
    "--risk-critical":"#FF6B6B","--risk-high":"#FFB347","--risk-medium":"#FFE066","--risk-low":"#7EC8A4",
  };


  // ═══════════════════════════════════════════════════════
  // ─── LOCK SCREEN ────────────────────────────────────────
  // ═══════════════════════════════════════════════════════
  const LockScreen = ({ onUnlock }) => {
    const [input, setInput] = useState("");
    const [shake, setShake] = useState(false);
    const [hint, setHint] = useState("");

    const press = (digit) => {
      if (input.length >= 4) return;
      const next = input + digit;
      setInput(next);
      if (next.length === 4) {
        if (next === prefs.pin) {
          onUnlock();
        } else {
          setShake(true);
          setHint("Falscher PIN — bitte erneut versuchen.");
          setTimeout(() => { setShake(false); setInput(""); setHint(""); }, 700);
        }
      }
    };

    const del = () => setInput(p => p.slice(0, -1));

    return (
      <div style={{
        position:"fixed", inset:0, zIndex:9999,
        background:"#0E0B1A",
        display:"flex", flexDirection:"column",
        alignItems:"center", justifyContent:"center",
        fontFamily:"var(--font)", gap:32, padding:24,
      }}>
        <style>{`
          @keyframes lockShake {
            0%,100%{transform:translateX(0)}
            20%,60%{transform:translateX(-8px)}
            40%,80%{transform:translateX(8px)}
          }
          .lock-shake { animation: lockShake 0.4s ease-out; }
        `}</style>

        {/* Icon + Titel */}
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🔐</div>
          <p style={{fontSize:20,fontWeight:800,color:"#E8E4F0",fontFamily:"'Outfit',sans-serif"}}>DoseDiary</p>
          <p style={{fontSize:13,color:"#A89CC0",marginTop:6}}>Nutze deinen PIN, um deine Daten lokal zu schützen.</p>
        </div>

        {/* PIN-Punkte */}
        <div className={shake ? "lock-shake" : ""} style={{display:"flex",gap:16}}>
          {[0,1,2,3].map(i => (
            <div key={i} style={{
              width:16, height:16, borderRadius:"50%",
              background: i < input.length ? "#9B7ECF" : "#2F2845",
              border: "2px solid " + (i < input.length ? "#9B7ECF" : "#3D3560"),
              transition: "background 0.15s, border 0.15s",
            }} />
          ))}
        </div>

        {hint && <p style={{fontSize:12,color:"#E06B8A",marginTop:-16}}>{hint}</p>}

        {/* Numpad */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,width:"100%",maxWidth:280}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((k, i) => (
            <button key={i}
              onClick={() => k === "⌫" ? del() : k !== "" ? press(k) : null}
              style={{
                height:64, borderRadius:16, fontSize: k === "⌫" ? 22 : 24,
                fontWeight:700, color: k === "" ? "transparent" : "#E8E4F0",
                background: k === "" ? "transparent" : k === "⌫" ? "#1A1529" : "#1A1529",
                border: k === "" ? "none" : "1px solid #2F2845",
                cursor: k === "" ? "default" : "pointer",
                transition:"background 0.1s",
              }}
            >
              {k}
            </button>
          ))}
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════
  // ─── PIN SETUP (in Privacy-Seite eingebettet) ──────────
  // ═══════════════════════════════════════════════════════
  const PinSetup = () => {
    const [step, setStep] = useState("menu"); // menu | set1 | set2 | remove
    const [pin1, setPin1] = useState("");
    const [pin2, setPin2] = useState("");
    const [msg, setMsg] = useState("");
    const [shake, setShake] = useState(false);
    const hasPin = !!prefs.pin;

    const pressDigit = (digit, target, setTarget, nextAction) => {
      if (target.length >= 4) return;
      const next = target + digit;
      setTarget(next);
      if (next.length === 4) setTimeout(() => nextAction(next), 180);
    };

    const NumPad = ({ value, onChange, onComplete }) => (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,width:"100%"}}>
        <div className={shake ? "lock-shake" : ""} style={{display:"flex",gap:14}}>
          {[0,1,2,3].map(i => (
            <div key={i} style={{
              width:14,height:14,borderRadius:"50%",
              background:i<value.length?"#9B7ECF":"#2F2845",
              border:"2px solid "+(i<value.length?"#9B7ECF":"#3D3560"),
              transition:"background 0.15s",
            }}/>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,width:"100%",maxWidth:260}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((k,i) => (
            <button key={i}
              onClick={() => {
                if (k === "⌫") { onChange(v => v.slice(0,-1)); }
                else if (k !== "") { pressDigit(k, value, v => onChange(v), onComplete); }
              }}
              style={{
                height:56,borderRadius:14,fontSize:k==="⌫"?20:22,fontWeight:700,
                color:k===""?"transparent":"#E8E4F0",
                background:k===""?"transparent":"#1A1529",
                border:k===""?"none":"1px solid #2F2845",
                cursor:k===""?"default":"pointer",
              }}>{k}</button>
          ))}
        </div>
      </div>
    );

    if (step === "menu") return (
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {hasPin ? (
          <>
            <div style={{background:"#6BCB7710",border:"1px solid #6BCB7733",borderRadius:12,padding:"10px 14px",display:"flex",gap:8,alignItems:"center"}}>
              <span>✅</span>
              <p style={{fontSize:12,color:"#A89CC0"}}>App-Sperre ist aktiv. PIN wurde gesetzt.</p>
            </div>
            <button onClick={() => setStep("remove")}
              style={{width:"100%",padding:"11px 0",borderRadius:12,fontSize:13,fontWeight:600,color:"#E06B8A",background:"#E06B8A10",border:"1px solid #E06B8A33",cursor:"pointer"}}>
              🗑️ PIN entfernen
            </button>
          </>
        ) : (
          <button onClick={() => { setPin1(""); setMsg(""); setStep("set1"); }}
            style={{width:"100%",padding:"11px 0",borderRadius:12,fontSize:13,fontWeight:600,color:"#9B7ECF",background:"#9B7ECF12",border:"1px solid #9B7ECF33",cursor:"pointer"}}>
            🔐 PIN einrichten
          </button>
        )}
        {msg && <p style={{fontSize:12,textAlign:"center",color:msg.startsWith("✓")?"#6BCB77":"#E06B8A"}}>{msg}</p>}
      </div>
    );

    if (step === "set1") return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
        <p style={{fontSize:13,color:"#A89CC0",textAlign:"center"}}>Neuen 4-stelligen PIN wählen:</p>
        <NumPad value={pin1} onChange={setPin1}
          onComplete={(v) => { setPin1(v); setPin2(""); setStep("set2"); }} />
        <button onClick={() => setStep("menu")} style={{fontSize:12,color:"#A89CC0",background:"none",border:"none",cursor:"pointer"}}>Abbrechen</button>
      </div>
    );

    if (step === "set2") return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
        <p style={{fontSize:13,color:"#A89CC0",textAlign:"center"}}>PIN bestätigen:</p>
        <NumPad value={pin2} onChange={setPin2}
          onComplete={async (v) => {
            if (v === pin1) {
              const updated = { ...prefs, pin: v };
              await savePrefs(updated);
              setMsg("✓ PIN gesetzt — App-Sperre aktiv.");
              setStep("menu");
            } else {
              setShake(true);
              setTimeout(() => { setShake(false); setPin2(""); setStep("set1"); setPin1(""); }, 600);
            }
          }} />
        <button onClick={() => setStep("menu")} style={{fontSize:12,color:"#A89CC0",background:"none",border:"none",cursor:"pointer"}}>Abbrechen</button>
      </div>
    );

    if (step === "remove") return (
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <p style={{fontSize:13,color:"#A89CC0",textAlign:"center"}}>Aktuellen PIN zur Bestätigung eingeben:</p>
        <NumPad value={pin2} onChange={setPin2}
          onComplete={async (v) => {
            if (v === prefs.pin) {
              const { pin: _, ...rest } = prefs;
              await savePrefs(rest);
              setMsg("✓ PIN entfernt — Sperre deaktiviert.");
              setStep("menu");
            } else {
              setShake(true);
              setTimeout(() => { setShake(false); setPin2(""); }, 600);
            }
          }} />
        <button onClick={() => setStep("menu")} style={{fontSize:12,color:"#A89CC0",background:"none",border:"none",cursor:"pointer"}}>Abbrechen</button>
      </div>
    );

    return null;
  };

  // ═══ MILESTONE POPUP OVERLAY ═══
  const MilestonePopupOverlay = milestonePopup ? (() => {
    const ms = milestonePopup;
    return (
      <div onClick={() => setMilestonePopup(null)}
        style={{
          position:"fixed", inset:0, zIndex:9998,
          background:"rgba(14,11,26,0.88)",
          display:"flex", alignItems:"center", justifyContent:"center",
          padding:24, backdropFilter:"blur(6px)",
        }}>
        <style>{`
          @keyframes msPopIn{from{opacity:0;transform:scale(0.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
          @keyframes msGlow{0%,100%{box-shadow:0 0 30px ${ms.color}44}50%{box-shadow:0 0 60px ${ms.color}88}}
          .ms-pop{animation:msPopIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards}
          .ms-glow{animation:msGlow 2s ease-in-out infinite}
        `}</style>
        <div className="ms-pop ms-glow rounded-3xl p-7 text-center max-w-sm w-full"
          style={{background:"linear-gradient(145deg,#1A1529,#221C34)",border:`2px solid ${ms.color}55`}}>
          {/* Medaille */}
          <div className="w-24 h-24 rounded-full mx-auto flex items-center justify-center mb-5"
            style={{
              background:`linear-gradient(135deg,${ms.color}22,${ms.color}44)`,
              border:`3px solid ${ms.color}`,
              boxShadow:`0 0 40px ${ms.color}44`,
              fontSize:44,
            }}>
            {ms.icon}
          </div>

          {/* Gold-Ring Akzent */}
          <div className="flex items-center justify-center gap-2 mb-3">
            <div style={{height:1,flex:1,background:`linear-gradient(90deg,transparent,${ms.color})`}} />
            <span style={{fontSize:11,fontWeight:700,color:ms.color,letterSpacing:2}}>MEILENSTEIN</span>
            <div style={{height:1,flex:1,background:`linear-gradient(90deg,${ms.color},transparent)`}} />
          </div>

          <p style={{fontSize:22,fontWeight:800,color:"#E8E4F0",fontFamily:"'Outfit',sans-serif",marginBottom:6}}>{ms.title}</p>
          <p style={{fontSize:13,color:"#A89CC0",lineHeight:1.6,marginBottom:16}}>{ms.popup}</p>
          <p style={{fontSize:11,color:"#6B6480",marginBottom:20}}>{ms.desc}</p>

          <button onClick={() => setMilestonePopup(null)}
            style={{
              background:`linear-gradient(135deg,${ms.color},${ms.color}cc)`,
              color:"#fff", border:"none", borderRadius:16,
              padding:"12px 32px", fontSize:14, fontWeight:700,
              cursor:"pointer", width:"100%",
            }}>
            ✨ Weiter
          </button>
        </div>
      </div>
    );
  })() : null;

  // ═══ LOCK SCREEN GATE ═══
  if (locked && prefs?.pin) return (
    <div style={{...theme}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
      <LockScreen onUnlock={() => setLocked(false)} />
    </div>
  );

  // ═══ ONBOARDING GATE ═══
  if (onboarded === null) return (
    <div style={{...theme,fontFamily:"var(--font)",background:"var(--bg)",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
      <p style={{color:"var(--tx2)",fontSize:14}}>Laden…</p>
    </div>
  );

  if (onboarded === false) return (
    <div style={{...theme,fontFamily:"var(--font)",background:"var(--bg)",color:"var(--tx)",minHeight:"100vh",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
      <style>{`
        @keyframes obSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @keyframes obSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-40px)}}
        .ob-enter{animation:obSlideIn 0.35s ease-out both}
        @keyframes obPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
        .ob-pulse{animation:obPulse 2s ease-in-out infinite}
        @media(prefers-reduced-motion:reduce){.ob-enter,.ob-pulse{animation:none!important;transform:none!important}}
      `}</style>

      {/* ─── Top Progress Bar (nur für Schritte 0+1) ─── */}
      {onboardStep < 2 && (
      <div className="px-6 pt-5 pb-2">
        <div className="flex items-center justify-between mb-2">
          <span style={{fontSize:13,fontWeight:600,color:"var(--tx2)"}}>Schritt {onboardStep + 1} von 2</span>
          <span style={{fontSize:13,fontWeight:700,color:"var(--acc)"}}>{Math.round((onboardStep + 1) / 2 * 100)}%</span>
        </div>
        <div className="w-full h-2 rounded-full" style={{background:"var(--bdr)"}}>
          <div className="h-2 rounded-full transition-all duration-500 ease-out" style={{width:`${(onboardStep + 1) / 2 * 100}%`,background:"var(--acc)"}} />
        </div>
      </div>
      )}

      {/* ─── Step Content ─── */}
      <div key={onboardStep} className={onboardStep === 2 ? "flex-1 flex flex-col ob-enter" : "flex-1 flex flex-col px-6 py-4 ob-enter"} style={{minHeight:0}}>
        <div className="flex-1 overflow-y-auto" style={{paddingBottom: onboardStep === 2 ? 0 : 16}}>

        {/* ═══ Step 0: Willkommen & Alterscheck ═══ */}
        {onboardStep === 0 && (
          <div className="space-y-5">
            <div className="text-center pt-2">
              <div className="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-4 ob-pulse" style={{background:"var(--acc)15",boxShadow:"0 8px 30px rgba(155,126,207,0.15)"}}>🌿</div>
              <h1 style={{fontSize:26,fontWeight:800,fontFamily:"var(--fontD)",lineHeight:1.2}}>DoseDiary</h1>
              <p style={{fontSize:15,color:"var(--tx2)",marginTop:8,lineHeight:1.5}}>Dein privater Begleiter für bewussten Umgang.</p>
            </div>

            {/* ── Altershinweis ── */}
            <div className="rounded-2xl p-5" style={{background:"var(--card)",border:"1px solid var(--bdr)"}}>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl" style={{background:"#E06B8A18"}}>🔞</div>
                <p style={{fontSize:16,fontWeight:700,color:"var(--tx)"}}>Ab 18 Jahren</p>
              </div>
              <p style={{fontSize:14,color:"var(--tx2)",lineHeight:1.7}}>
                Diese App enthält Informationen über psychoaktive Substanzen. Sie dient der Schadensminimierung — nicht der Anleitung zum Konsum.
              </p>
            </div>

            {/* ── Rechtliche Hinweise (Dropdown) ── */}
            <details className="rounded-2xl overflow-hidden" style={{background:"#E06B8A10",border:"2px solid #E06B8A55"}}>
              <summary className="px-5 py-4 cursor-pointer flex items-center justify-between" style={{listStyle:"none"}}>
                <div className="flex items-center gap-2">
                  <span style={{fontSize:18}}>⚖️</span>
                  <p style={{fontSize:14,fontWeight:800,color:"#E06B8A",letterSpacing:"0.01em"}}>Rechtliche Hinweise</p>
                </div>
                <span style={{fontSize:12,color:"var(--tx2)"}}>Mehr ▾</span>
              </summary>
              <div className="px-5 pb-4 space-y-3">
                <p style={{fontSize:13,fontWeight:700,color:"var(--tx)",lineHeight:1.6}}>
                  DoseDiary ist kein Medizinprodukt im Sinne der EU-Medizinprodukteverordnung (MDR 2017/745).
                </p>
                <p style={{fontSize:13,color:"var(--tx2)",lineHeight:1.7}}>
                  Die App bietet <strong style={{color:"var(--tx)"}}>keine medizinischen Diagnosen</strong>, <strong style={{color:"var(--tx)"}}>keine Therapievorschläge</strong> und <strong style={{color:"var(--tx)"}}>keine Dosierungsempfehlungen</strong> für den Konsum psychoaktiver Substanzen.
                </p>
                <div className="space-y-2 pt-1">
                  {[
                    { icon:"📓", text:"DoseDiary ist ein Selbstreflexions- und Informationstagebuch zur Förderung der Konsumkompetenz." },
                    { icon:"ℹ️", text:"Alle Substanz- und Wechselwirkungsinfos dienen ausschließlich der Schadensminimierung (Harm Reduction) und ersetzen keinen ärztlichen Rat." },
                    { icon:"🚑", text:"Bei medizinischen Notfällen: Notruf 112. Die App ist kein Ersatz für Notfallhilfe." },
                    { icon:"👤", text:"Die Nutzung erfolgt freiwillig und auf eigene Verantwortung." },
                  ].map((item, i) => (
                    <div key={i} className="flex gap-3 items-start">

        {/* ═══ Step 1: Substanz-Auswahl (Grid) ═══ */}

  // ═══ MAIN APP (only rendered after successful onboarding) ═══
